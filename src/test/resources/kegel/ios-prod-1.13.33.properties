# Observed on iPhone 17 Pro, iOS 26.5, prod 1.13.33; English UI.
platform=ios
app.version=1.13.33
environment=prod
regular.program=Kegel Challenge
regular.card=id:Morning Kegel Workout
regular.screen=xpath://XCUIElementTypeStaticText[starts-with(@name,'Regular Kegel (Level')]
regular.stretching=xpath://XCUIElementTypeOther[@name='KegelComponentViewSwitcherView']//XCUIElementTypeSwitch
regular.start=id:START WORKOUT
player.pause=id:PlayerPauseIcon
player.paused=id:PlayerPlayIcon
# Exercise title in the player's bottom strip; REST is the adjacent next exercise.
workout.identity=xpath://XCUIElementTypeCell[@traits='Selected']//XCUIElementTypeStaticText
player.phase=xpath://XCUIElementTypeStaticText[@name='PAUSE']/following-sibling::XCUIElementTypeStaticText[1]
guide.open=id:GUIDE
guide.screen=id:Finding Pelvic Floor
guide.close=id:ic outline close
info.open=id:ic outline info
info.screen=xpath://XCUIElementTypeStaticText[contains(@name,'Kegels')]
info.title=xpath://XCUIElementTypeStaticText[contains(@name,'Kegels')]
info.content=xpath://XCUIElementTypeStaticText[@name='Quickly contract your pelvic floor muscle']
info.close=id:ic outline close
info.expectedTitle.INVERTED\ CLASP="Inverted Clasp" Kegels
info.expectedContent.INVERTED\ CLASP=Quickly contract your pelvic floor muscle

# Custom Kegel catalog and exercise settings.
custom.flow=ios-catalog
custom.parentProgram=Last Longer
custom.program=Last Longer: Retain
custom.card=id:Custom Kegel Training
custom.close=id:ProgramCloseButtonIcon
custom.screen=xpath://XCUIElementTypeCollectionView[@visible='true' and (.//XCUIElementTypeOther[@name='KegelComponentViewSwitcherView'] or .//XCUIElementTypeStaticText[@name='+ ADD EXERCISE'])]
custom.collection=xpath://XCUIElementTypeCollectionView[@visible='true']
custom.rows=xpath://XCUIElementTypeCollectionView[@visible='true']//XCUIElementTypeOther[@name='KegelStartExerciseView']
custom.row.title=xpath:(.//XCUIElementTypeStaticText)[1]
custom.row.metadata=xpath:(.//XCUIElementTypeStaticText)[2]
custom.totalDuration=xpath://XCUIElementTypeStaticText[@name='Duration:' and @visible='true']/following-sibling::XCUIElementTypeStaticText[1]
custom.fields=intensity,duration
custom.editor=xpath://XCUIElementTypeStaticText[@label='ADJUST:' and @visible='true']
custom.editor.close=id:GreyBackButton
custom.remove=xpath://XCUIElementTypeStaticText[@name='Remove' and @visible='true']/following-sibling::XCUIElementTypeImage
custom.confirm=xpath://XCUIElementTypeStaticText[@label='Remove this exercise from the current workout' and @visible='true']
custom.cancel=id:CANCEL
custom.delete=id:REMOVE
custom.start=id:START WORKOUT
custom.add=id:+ ADD EXERCISE
custom.picker=id:Add exercises
custom.picker.close=id:GreyBackButton
custom.pick=xpath://XCUIElementTypeStaticText[@name={value} and @visible='true']/following-sibling::XCUIElementTypeImage
custom.picked=xpath://XCUIElementTypeStaticText[@name={value} and @visible='true']/following-sibling::XCUIElementTypeImage[@name='ic_glyph_added']
custom.picker.save=id:SAVE
custom.edit.intensity=xpath://XCUIElementTypeStaticText[@name='Intensity' and @visible='true']/following-sibling::XCUIElementTypeOther//XCUIElementTypeStaticText
custom.wheel=xpath://XCUIElementTypePickerWheel[@visible='true']
custom.wheel.save=id:SELECT
custom.save=id:SAVE

# Prod program switch confirmation and first-switch hint, observed through UI.
program.confirm=id:Switch program
program.hint=id:To switch back, tap here
program.hint.close=id:OK
program.selected=xpath://XCUIElementTypeStaticText[@name={value} and @visible='true']

# Logout returns to Quiz on this build; native profile login opens OTP directly.
auth.flow=quiz-profile
auth.quiz=id:BEAT PREMATURE EJACULATION
auth.goal=Beat premature ejaculation
auth.profileReady=id:Program settings
auth.confirm=id:CONFIRM
auth.changeEmail=id:CHANGE EMAIL
auth.emailForm=id:ENTER YOUR EMAIL TO SYNC YOUR PROGRESS AND SETTINGS
auth.existingLogin=id:LOGIN

# Native login can leave cached Today; explicitly reselect its current program.
program.reloadBeforeSnapshot=true
