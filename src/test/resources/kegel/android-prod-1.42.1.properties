# Observed Android 16 / Pixel 6, prod 1.42.1 (350), English UI.
platform=android
app.version=1.42.1
environment=prod
# Dedicated session established through email/OTP UI; Profile is never opened.
auth.flow=android-session
regular.program=Kegel Challenge
regular.card=xpath://*[@resource-id='com.vamapps.thecoach:id/tvLessonName' and @text='Morning Kegel Workout']
regular.screen=xpath://*[@resource-id='com.vamapps.thecoach:id/tvTitle' and starts-with(@text,'REGULAR KEGEL')]
regular.stretching=id:com.vamapps.thecoach:id/swStr
regular.start=id:com.vamapps.thecoach:id/btStartWork
player.expectedExercise=INVERTED CLASP
player.pause=id:com.vamapps.thecoach:id/ivPause
player.paused=id:com.vamapps.thecoach:id/ivPlay
workout.identity=id:com.vamapps.thecoach:id/tvExerciseName
player.phase=id:com.vamapps.thecoach:id/tvActionName
guide.open=id:com.vamapps.thecoach:id/cvHowTofind
guide.screen=xpath://*[@resource-id='com.vamapps.thecoach:id/tvControlHeader' and @text='Finding Pelvic Floor']
guide.close=id:com.vamapps.thecoach:id/ivButtonClose
guide.quit=xpath://*[@resource-id='com.vamapps.thecoach:id/tvDialogtitle' and contains(@text,'daily activity')]
guide.quit.confirm=id:com.vamapps.thecoach:id/btnYes
info.open=id:com.vamapps.thecoach:id/ivExerciseInfo
info.screen=id:com.vamapps.thecoach:id/rvContent
info.title=id:com.vamapps.thecoach:id/tvHeader
info.content=xpath:(//*[@resource-id='com.vamapps.thecoach:id/tvBullettext'])[1]
info.close=id:com.vamapps.thecoach:id/btnClose
info.expectedTitle.INVERTED\ CLASP="Inverted Clasp" Kegels
info.expectedContent.INVERTED\ CLASP=Quickly contract your pelvic floor muscle

custom.flow=android-catalog
custom.parentProgram=Last Longer
custom.program=Last Longer: Retain
custom.card=xpath://*[@resource-id='com.vamapps.thecoach:id/tvLessonName' and @text='Custom Kegel Training']
custom.screen=xpath://*[@resource-id='com.vamapps.thecoach:id/tvTitle' and @text='CUSTOM KEGEL WORKOUT'] | //*[@resource-id='com.vamapps.thecoach:id/btAddExercise']
custom.close=id:com.vamapps.thecoach:id/btnNavigateUp
custom.collection=xpath://android.widget.ScrollView | //*[@resource-id='com.vamapps.thecoach:id/rvData']
custom.list=id:com.vamapps.thecoach:id/rvActions
custom.rows=xpath://*[@resource-id='com.vamapps.thecoach:id/rvActions']/*[@clickable='true']
custom.row.title=xpath:.//*[@resource-id='com.vamapps.thecoach:id/tvTitle']
custom.row.metadata=xpath:.//*[@resource-id='com.vamapps.thecoach:id/tvValue']
custom.totalDuration=id:com.vamapps.thecoach:id/tvWorkutDuration
custom.fields=intensity,duration
custom.editor=id:com.vamapps.thecoach:id/tvAdjust
custom.editor.close=id:com.vamapps.thecoach:id/btnNavigateUp
custom.remove=id:com.vamapps.thecoach:id/mcDeleteContainer
custom.confirm=xpath://*[@resource-id='com.vamapps.thecoach:id/tvDialogtitle' and @text='Remove this exercise from current workout']
custom.cancel=id:com.vamapps.thecoach:id/btnNo
custom.delete=id:com.vamapps.thecoach:id/btnYes
custom.start=id:com.vamapps.thecoach:id/btStartWork
custom.add=id:com.vamapps.thecoach:id/btAddExercise
custom.picker=xpath://*[@resource-id='com.vamapps.thecoach:id/tvName' and @text='Add exercise']
custom.picker.close=id:com.vamapps.thecoach:id/btnNavigateUp
custom.pick=xpath://*[@resource-id='com.vamapps.thecoach:id/rvData']/*[.//*[@resource-id='com.vamapps.thecoach:id/tvTitle' and @text={value}]]//*[@resource-id='com.vamapps.thecoach:id/cbSelected']
custom.picked=xpath://*[@resource-id='com.vamapps.thecoach:id/rvData']/*[.//*[@resource-id='com.vamapps.thecoach:id/tvTitle' and @text={value}]]//*[@resource-id='com.vamapps.thecoach:id/cbSelected' and @checked='true']
custom.selected=xpath://*[@resource-id='com.vamapps.thecoach:id/rvData']//*[@resource-id='com.vamapps.thecoach:id/cbSelected' and @checked='true']
custom.picker.save=id:com.vamapps.thecoach:id/btnSaveActive
custom.edit.intensity=id:com.vamapps.thecoach:id/mcIntensContainer
custom.wheel=xpath://android.widget.NumberPicker
custom.wheel.value=id:android:id/numberpicker_input
custom.wheel.save=id:com.vamapps.thecoach:id/btnSave
custom.editor.intensity=id:com.vamapps.thecoach:id/tvSelectedIntens
custom.save=id:com.vamapps.thecoach:id/btnSaveActive
custom.footer=xpath://*[@resource-id='com.vamapps.thecoach:id/btnSaveActive' or @resource-id='com.vamapps.thecoach:id/btnSavePassive']
